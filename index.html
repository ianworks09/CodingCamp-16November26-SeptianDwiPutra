<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>To Do List Life Dashboard</title>
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body>

    <!-- Storage unavailable warning banner (Requirement 8.2) -->
    <div id="storage-warning" role="alert" aria-live="polite" hidden>
      <span id="storage-warning-message">Storage is unavailable. Your data will not be saved.</span>
      <button type="button" id="storage-warning-dismiss" aria-label="Dismiss warning">×</button>
    </div>

    <main>

      <!-- Greeting Widget (Requirement 1) -->
      <section id="greeting-widget" aria-label="Greeting">
        <header>
          <p id="greeting-time" aria-label="Current time"></p>
          <p id="greeting-date" aria-label="Current date"></p>
          <h1 id="greeting-message" aria-label="Greeting message"></h1>
        </header>
      </section>

      <!-- Focus Timer Widget (Requirement 2) -->
      <section id="focus-timer-widget" aria-label="Focus Timer">
        <h2>Focus Timer</h2>
        <div id="timer-display" role="timer" aria-live="off" aria-label="Time remaining">25:00</div>
        <div id="timer-controls">
          <button type="button" id="timer-start" aria-label="Start timer">Start</button>
          <button type="button" id="timer-stop" aria-label="Stop timer" disabled>Stop</button>
          <button type="button" id="timer-reset" aria-label="Reset timer">Reset</button>
        </div>
      </section>

      <!-- Task List Widget (Requirements 3, 4, 5) -->
      <section id="task-list-widget" aria-label="Task List">
        <h2>To-Do List</h2>

        <form id="task-form" novalidate>
          <label for="task-input">New Task</label>
          <input
            type="text"
            id="task-input"
            name="task-input"
            maxlength="200"
            placeholder="Enter a task…"
            aria-describedby="task-error"
            autocomplete="off"
          />
          <button type="submit" id="task-submit">Add Task</button>
        </form>
        <p id="task-error" role="alert" aria-live="polite"></p>

        <ul id="task-container" aria-label="Task list" aria-live="polite"></ul>
      </section>

      <!-- Quick Links Widget (Requirements 6, 7) -->
      <section id="quick-links-widget" aria-label="Quick Links">
        <h2>Quick Links</h2>

        <form id="link-form" novalidate>
          <label for="link-label-input">Label</label>
          <input
            type="text"
            id="link-label-input"
            name="link-label-input"
            maxlength="50"
            placeholder="Link label…"
            aria-describedby="link-error"
            autocomplete="off"
          />

          <label for="link-url-input">URL</label>
          <input
            type="url"
            id="link-url-input"
            name="link-url-input"
            placeholder="https://…"
            aria-describedby="link-error"
            autocomplete="off"
          />

          <button type="submit" id="link-submit">Add Link</button>
        </form>
        <p id="link-error" role="alert" aria-live="polite"></p>

        <div id="links-container" aria-label="Quick links" aria-live="polite"></div>
      </section>

    </main>

    <script src="js/app.js"></script>
  </body>
</html>
